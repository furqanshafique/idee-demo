<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>IDEE Regeltests</title>
<style>body{font:14px ui-monospace,Menlo,monospace;margin:20px}pre{white-space:pre-wrap}</style></head>
<body><h1>IDEE Regeltests (Browser)</h1><pre id="out">läuft …</pre>
<script type="module">
  const lines = []; const orig = console.log; console.log = (...a) => { lines.push(a.join(' ')); orig(...a); };
  const m = await import('../tests/rules.test.js').catch(e => ({ summary: { pass: 0, fail: 1, results: [['FAIL', e.message]] } }));
  document.getElementById('out').textContent = lines.join('\n') || JSON.stringify(m.summary, null, 2);
  document.title = m.summary.fail ? 'FAIL' : 'PASS';
</script></body></html>
